name: Import implementation

on:
  push:
    branches: [ feat/import-implementation ]
    paths:
      - ".github/workflows/import-implementation.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v7
        with:
          ref: feat/import-implementation

      - name: Import project implementation
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/gabrielhsp-sys/academic-system-legacy.git "$tmp/legacy"

          rm -rf academic-system
          cp -a "$tmp/legacy/academic-system" ./academic-system

          test -f academic-system/pom.xml
          test -d academic-system/src/main
          test -d academic-system/src/test

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academic-system
          git commit -m "feat: implementa Academic System"
          git push origin feat/import-implementation
