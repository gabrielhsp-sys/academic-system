# Workflow de release (TUS-2419): ao criar uma tag de versao, o projeto
# e construido, os testes sao executados e o jar e publicado
# automaticamente em GitHub Releases.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build e testes com Maven
        run: mvn -B clean verify
        working-directory: academic-system

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: academic-system/target/AcademicSystem-1.0-SNAPSHOT.jar
          generate_release_notes: true
