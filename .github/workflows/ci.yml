# Pipeline de integracao continua (TUS-2415) com geracao de relatorio
# de cobertura de testes via JaCoCo (TUS-2416).
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academic-system
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build e testes com Maven
        run: mvn -B clean verify

      - name: Publicar relatorio de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-coverage-report
          path: academic-system/target/site/jacoco
