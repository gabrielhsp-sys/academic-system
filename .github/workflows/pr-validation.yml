# Validacao automatica de pull requests (TUS-2418): o build e os testes
# precisam passar para que o PR possa ser integrado (TUS-2420).
name: PR Validation

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academic-system
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build e testes com Maven
        run: mvn -B clean verify
